<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <title>Remix Gestor de Trámites PPP - UTEA Filial Cusco</title>
    <script type="text/javascript">
      // Redirección automática de fallback para Single Page Application (SPA) en GitHub Pages
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    <p>Redirigiendo al Gestor de Trámites PPP - UTEA...</p>
  </body>
</html>
